name: 构建并推送 Pre Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-preview"]

jobs:
  # 版本生成 Job
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Generate version
        id: version
        run: |
          # 生成 yyyy.mm.dd.hhmm 格式的版本号
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      
      - name: Show version info
        run: |
          echo "Build version: ${{ steps.version.outputs.value }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Build time: ${{ steps.time.outputs.value }}"

  # ==================== Windows 构建 ====================
  windows-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
      
      - name: Build Windows executable
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:SelfContained=false `
            /p:Version=${{ needs.version.outputs.v }} `
            /p:AssemblyTitle="BedrockBoot" `
            /p:AssemblyDescription="A Minecraft Bedrock Launcher" `
            /p:AssemblyCompany="Round-Studio" `
            /p:Product="BedrockBoot" `
            /p:Copyright="Copyright (C) Round-Studio" `
            /p:PackageLicenseExpression="GPL-3.0-only" `
            -o "./../../Release-publish/"
      
      - name: Rename Windows executable
        run: |
          cd ./Release-publish
          if (Test-Path "BedrockBoot.exe") {
            Rename-Item "BedrockBoot.exe" "BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe"
            Write-Host "✅ Renamed to BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe"
          } else {
            Write-Host "⚠️ BedrockBoot.exe not found"
            Get-ChildItem
          }
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ./Release-publish/BedrockBoot-*-win-x64.exe
          retention-days: 7

  # ==================== Linux AppImage 构建 ====================
  linux-appimage-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
      
      - name: Publish .NET application for Linux
        run: |
          dotnet publish ./src/BedrockBoot/BedrockBoot.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:Version=${{ needs.version.outputs.v }} \
            -p:AssemblyTitle="BedrockBoot" \
            -p:AssemblyDescription="A Minecraft Bedrock Launcher" \
            -p:AssemblyCompany="Round-Studio" \
            -p:Product="BedrockBoot" \
            -p:Copyright="Copyright (C) Round-Studio" \
            -p:PackageLicenseExpression="GPL-3.0-only" \
            -o ./AppDir/usr/bin
      
      - name: Create AppDir structure
        run: |
          mkdir -p ./AppDir/usr/share/applications
          mkdir -p ./AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p ./AppDir/usr/share/metainfo
      
      - name: Copy icon
        run: |
          if [ -f "./assets/BedrockBoot.Icon.512x.png" ]; then
            cp ./assets/BedrockBoot.Icon.512x.png ./AppDir/usr/share/icons/hicolor/512x512/apps/top.roundstudio.bedrockboot.png
            echo "✅ Icon copied"
          else
            echo "⚠️ Icon not found, creating placeholder"
            # 创建简单的占位符图标
            convert -size 512x512 xc:transparent -fill "#4A90E2" -draw "rectangle 0,0 512,512" \
              -fill white -draw "text 256,256 'BB'" ./AppDir/usr/share/icons/hicolor/512x512/apps/top.roundstudio.bedrockboot.png 2>/dev/null || true
          fi
      
      - name: Create desktop file
        run: |
          cat > ./AppDir/usr/share/applications/top.roundstudio.bedrockboot.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=BedrockBoot
          Comment=A Minecraft Bedrock Launcher
          Exec=BedrockBoot
          Icon=top.roundstudio.bedrockboot
          Terminal=false
          Categories=Utility;Game;
          StartupWMClass=BedrockBoot
          Keywords=minecraft;bedrock;launcher;
          EOF
          
          echo "✅ Desktop file created"
      
      - name: Create GPL-3.0 compliant AppStream metadata
        run: |
          cat > ./AppDir/usr/share/metainfo/top.roundstudio.bedrockboot.appdata.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>top.roundstudio.bedrockboot</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>GPL-3.0-only</project_license>
            <name>BedrockBoot</name>
            <summary>A Minecraft Bedrock Launcher</summary>
            <description>
              <p>BedrockBoot is a powerful bootstrapping application designed to simplify and streamline the Minecraft Bedrock Edition experience.</p>
              <p>Key features:</p>
              <ul>
                <li>Easy version management</li>
                <li>Mod support and management</li>
                <li>Cross-platform compatibility</li>
                <li>Automatic updates</li>
                <li>Open source under GPL-3.0</li>
              </ul>
              <p>This program is free software: you can redistribute it and/or modify it under the terms of the GNU General Public License as published by the Free Software Foundation, version 3 of the License.</p>
            </description>
            <launchable type="desktop-id">top.roundstudio.bedrockboot.desktop</launchable>
            <url type="homepage">https://github.com/Round-Studio/BedrockBoot</url>
            <url type="bugtracker">https://github.com/Round-Studio/BedrockBoot/issues</url>
            <url type="vcs-browser">https://github.com/Round-Studio/BedrockBoot</url>
            <screenshots>
              <screenshot type="default">
                <image>https://raw.githubusercontent.com/Round-Studio/BedrockBoot/main/assets/screenshot.png</image>
              </screenshot>
            </screenshots>
            <provides>
              <binary>BedrockBoot</binary>
            </provides>
            <content_rating type="oars-1.1">
              <content_attribute id="social-chat">none</content_attribute>
              <content_attribute id="social-info">none</content_attribute>
              <content_attribute id="social-audio">none</content_attribute>
              <content_attribute id="social-contact">none</content_attribute>
              <content_attribute id="money-purchasing">none</content_attribute>
            </content_rating>
            <developer id="top.roundstudio">
              <name>Round Studio</name>
            </developer>
            <releases>
              <release version="${{ needs.version.outputs.v }}" date="${{ needs.version.outputs.value }}" />
            </releases>
          </component>
          EOF
          
          echo "✅ AppStream metadata created"
      
      - name: Create AppRun script
        run: |
          cat > ./AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH}"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          exec "${HERE}/usr/bin/BedrockBoot" "$@"
          EOF
          chmod +x ./AppDir/AppRun
          echo "✅ AppRun script created"
      
      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      
      - name: Build AppImage
        run: |
          # 使用 --skip-appstream-validation 跳过验证问题
          ARCH=x86_64 ./appimagetool-x86_64.AppImage \
            --skip-appstream-validation \
            ./AppDir \
            "BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage"
          
          echo "✅ AppImage built successfully"
      
      - name: Verify AppImage
        run: |
          if [ -f "BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage" ]; then
            echo "✅ AppImage file exists"
            ls -lh BedrockBoot-*.AppImage
            # 检查文件是否为有效的 ELF 文件
            file BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage
          else
            echo "❌ AppImage file not found"
            exit 1
          fi
      
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ./BedrockBoot-*-linux-x86_64.AppImage
          retention-days: 7

  # ==================== 创建 Release ====================
  create-release:
    runs-on: ubuntu-latest
    needs: [version, windows-build, linux-appimage-build]
    if: always() && needs.version.result == 'success' && (needs.windows-build.result == 'success' || needs.linux-appimage-build.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 3
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release-files/windows
        continue-on-error: true
      
      - name: Download Linux AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: ./release-files/linux
        continue-on-error: true
      
      - name: List downloaded files
        run: |
          echo "📁 Release files structure:"
          echo ""
          echo "Windows files:"
          ls -lh ./release-files/windows/ 2>/dev/null || echo "  No Windows files"
          echo ""
          echo "Linux files:"
          ls -lh ./release-files/linux/ 2>/dev/null || echo "  No Linux files"
      
      - name: Generate checksums
        run: |
          cd ./release-files
          echo "## 🔐 Checksums" > checksums.md
          echo "" >> checksums.md
          echo '```' >> checksums.md
          for file in windows/* linux/*; do
            if [ -f "$file" ]; then
              echo "$(sha256sum $file | cut -d' ' -f1)  $(basename $file)" >> checksums.md
            fi
          done
          echo '```' >> checksums.md
          cat checksums.md
      
      - name: Get commit messages
        id: commits
        run: |
          echo "latest_commit=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT
          CHANGELOG=$(git log -5 --pretty=format:"- %s (%h)" --reverse | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "committer=$(git log -1 --pretty=format:%an)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          release_name: "BedrockBoot ${{ needs.version.outputs.v }} - Pre-release"
          body: |
            ## 🚀 BedrockBoot ${{ needs.version.outputs.v }} 测试版推送
            
            ### 📦 构建信息
            - **版本号**: `${{ needs.version.outputs.v }}`
            - **构建时间**: ${{ needs.version.outputs.time }}
            - **提交哈希**: `${{ github.sha }}`
            - **提交者**: ${{ steps.commits.outputs.committer }}
            - **提交信息**: ${{ steps.commits.outputs.latest_commit }}
            
            ### 📝 变更日志
            ${{ steps.commits.outputs.changelog }}
            
            ### ⚠️ 注意事项
            - 这是预发布版本，仅供测试使用
            - 如遇到问题，请到 [Issues](https://github.com/${{ github.repository }}/issues) 反馈
            
            ---
            *🤖 自动化构建发布 | [查看工作流运行记录](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          draft: false
          prerelease: true
          files: |
            ./release-files/windows/*.exe
            ./release-files/linux/*.AppImage
            ./release-files/checksums.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release summary
        run: |
          echo "## ✅ Release 创建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release 信息**" >> $GITHUB_STEP_SUMMARY
          echo "- 标签: ${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- 版本: ${{ needs.version.outputs.v }}" >> $GITHUB_STEP_SUMMARY
          echo "- 查看: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建产物**" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Linux AppImage: ✅" >> $GITHUB_STEP_SUMMARY