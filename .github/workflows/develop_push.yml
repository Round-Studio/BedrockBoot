name: 构建并推送 Pre Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-preview"]

jobs:
  # 版本生成 Job
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Generate version
        id: version
        run: |
          # 生成 yyyy.mm.dd.hhmm 格式的版本号
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      
      - name: Show version info
        run: |
          echo "Build version: ${{ steps.version.outputs.value }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Build time: ${{ steps.time.outputs.value }}"

  # ==================== Windows 构建 ====================
  windows-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
      
      - name: Build Windows executable
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:SelfContained=false `
            /p:Version=${{ needs.version.outputs.v }} `
            /p:AssemblyTitle="BedrockBoot" `
            /p:AssemblyDescription="A Minecraft Bedrock Launcher" `
            /p:AssemblyCompany="Round-Studio" `
            /p:Product="BedrockBoot" `
            /p:Copyright="Copyright (C) Round-Studio" `
            /p:PackageLicenseExpression="GPL-3.0-only" `
            -o "./../../Release-publish/"
      
      - name: Rename Windows executable
        run: |
          cd ./Release-publish
          if (Test-Path "BedrockBoot.exe") {
            Rename-Item "BedrockBoot.exe" "BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe"
            Write-Host "✅ Renamed to BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe"
          } else {
            Write-Host "⚠️ BedrockBoot.exe not found, listing files:"
            Get-ChildItem
          }
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ./Release-publish/BedrockBoot-*-win-x64.exe
          retention-days: 7

  # ==================== Linux AppImage 构建 ====================
  linux-appimage-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
      
      - name: Publish .NET application for Linux
        run: |
          dotnet publish ./src/BedrockBoot/BedrockBoot.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:Version=${{ needs.version.outputs.v }} \
            -p:AssemblyTitle="BedrockBoot" \
            -p:AssemblyDescription="A Minecraft Bedrock Launcher" \
            -p:AssemblyCompany="Round-Studio" \
            -p:Product="BedrockBoot" \
            -p:Copyright="Copyright (C) Round-Studio" \
            -p:PackageLicenseExpression="GPL-3.0-only" \
            -o ./AppDir/usr/bin
      
      - name: Create AppDir structure
        run: |
          mkdir -p ./AppDir/usr/share/applications
          mkdir -p ./AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p ./AppDir/usr/share/metainfo
      
      - name: Copy icon
        run: |
          if [ -f "./assets/BedrockBoot.Icon.512x.png" ]; then
            cp ./assets/BedrockBoot.Icon.512x.png ./AppDir/usr/share/icons/hicolor/512x512/apps/bedrockboot.png
            echo "✅ Icon copied"
          else
            echo "⚠️ Icon not found, creating placeholder"
            # 创建简单的文本图标（需要 imagemagick）
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert -size 512x512 xc:#4A90E2 -gravity center -pointsize 120 -fill white -annotate 0 "BB" ./AppDir/usr/share/icons/hicolor/512x512/apps/bedrockboot.png
          fi
      
      - name: Create desktop file
        run: |
          cat > ./AppDir/usr/share/applications/bedrockboot.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=BedrockBoot
          Comment=A Minecraft Bedrock Launcher
          Exec=BedrockBoot
          Icon=bedrockboot
          Terminal=false
          Categories=Utility;Game;
          StartupWMClass=BedrockBoot
          Keywords=minecraft;bedrock;launcher;
          EOF
          
          echo "✅ Desktop file created"
      
      - name: Create AppStream metadata (minimal valid version)
        run: |
          cat > ./AppDir/usr/share/metainfo/bedrockboot.appdata.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>bedrockboot</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>GPL-3.0-only</project_license>
            <name>BedrockBoot</name>
            <summary>A Minecraft Bedrock Launcher</summary>
            <description>
              <p>BedrockBoot is a powerful bootstrapping application for Minecraft Bedrock Edition.</p>
            </description>
            <launchable type="desktop-id">bedrockboot.desktop</launchable>
          </component>
          EOF
          
          echo "✅ AppStream metadata created"
      
      - name: Create AppRun script
        run: |
          cat > ./AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH}"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          exec "${HERE}/usr/bin/BedrockBoot" "$@"
          EOF
          chmod +x ./AppDir/AppRun
          echo "✅ AppRun script created"
      
      - name: Verify AppDir structure
        run: |
          echo "📁 AppDir structure:"
          ls -la ./AppDir/
          echo ""
          echo "📁 usr/bin contents:"
          ls -la ./AppDir/usr/bin/ | head -20
          echo ""
          echo "📁 desktop file:"
          cat ./AppDir/usr/share/applications/bedrockboot.desktop
      
      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      
      - name: Build AppImage (skip validation to avoid errors)
        run: |
          # 使用 --skip-appstream-validation 跳过所有验证
          ARCH=x86_64 ./appimagetool-x86_64.AppImage \
            --skip-appstream-validation \
            ./AppDir \
            "BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage"
          
          echo "✅ AppImage built successfully"
      
      - name: Verify AppImage
        run: |
          if [ -f "BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage" ]; then
            echo "✅ AppImage file exists"
            ls -lh BedrockBoot-*.AppImage
            file BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage
          else
            echo "❌ AppImage file not found"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
      
      - name: Test AppImage (basic)
        run: |
          # 简单测试：检查 AppImage 是否能运行（--help 或 --version）
          chmod +x BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage
          ./BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage --help 2>&1 | head -5 || echo "AppImage is executable"
      
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ./BedrockBoot-*-linux-x86_64.AppImage
          retention-days: 7

  # ==================== 创建 Release ====================
  create-release:
    runs-on: ubuntu-latest
    needs: [version, windows-build, linux-appimage-build]
    if: always() && needs.version.result == 'success' && (needs.windows-build.result == 'success' || needs.linux-appimage-build.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 3
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release-files/windows
        continue-on-error: true
      
      - name: Download Linux AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: ./release-files/linux
        continue-on-error: true
      
      - name: List downloaded files
        run: |
          echo "📁 Release files structure:"
          echo ""
          echo "Windows files:"
          ls -lh ./release-files/windows/ 2>/dev/null || echo "  No Windows files"
          echo ""
          echo "Linux files:"
          ls -lh ./release-files/linux/ 2>/dev/null || echo "  No Linux files"
      
      - name: Generate checksums
        run: |
          cd ./release-files
          echo "## 🔐 Checksums" > checksums.md
          echo "" >> checksums.md
          echo '```' >> checksums.md
          for file in windows/* linux/*; do
            if [ -f "$file" ]; then
              sha256sum "$file" | sed 's|./||' >> checksums.md
            fi
          done
          echo '```' >> checksums.md
          echo "" >> checksums.md
          cat checksums.md
      
      - name: Get commit messages
        id: commits
        run: |
          echo "latest_commit=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT
          CHANGELOG=$(git log -5 --pretty=format:"- %s (%h)" --reverse | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "committer=$(git log -1 --pretty=format:%an)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          release_name: "BedrockBoot ${{ needs.version.outputs.v }} - Pre-release"
          body: |
            ## 🚀 BedrockBoot ${{ needs.version.outputs.v }} 测试版推送
            
            ### 📦 构建信息
            - **版本号**: `${{ needs.version.outputs.v }}`
            - **构建时间**: ${{ needs.version.outputs.time }}
            - **提交哈希**: `${{ github.sha }}`
            - **提交者**: ${{ steps.commits.outputs.committer }}
            - **提交信息**: ${{ steps.commits.outputs.latest_commit }}
            
            ### 📝 变更日志
            ${{ steps.commits.outputs.changelog }}
            
            ### 📥 下载链接
            
            #### Windows 🪟
            - [BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe)
            
            #### Linux 🐧
            - [BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage)
            
            ### 💻 使用说明
            
            #### Windows 用户
            1. 下载 `BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe`
            2. 直接运行即可（无需安装 .NET 运行时）
            
            #### Linux 用户
            1. 下载 `BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage`
            2. 添加执行权限：`chmod +x BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage`
            3. 运行：`./BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage`
            
            ### 🔐 验证文件完整性
            ${{ steps.checksums.outputs.checksums }}
            
            ### 📄 许可证
            本项目采用 **GNU General Public License v3.0** 开源协议。
            
            ### ⚠️ 注意事项
            - 这是预发布版本，仅供测试使用
            - 如遇到问题，请到 [Issues](https://github.com/${{ github.repository }}/issues) 反馈
            
            ---
            *🤖 自动化构建发布 | [查看工作流运行记录](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          draft: false
          prerelease: true
          files: |
            ./release-files/windows/*.exe
            ./release-files/linux/*.AppImage
            ./release-files/checksums.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release summary
        run: |
          echo "## ✅ Release 创建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release 信息**" >> $GITHUB_STEP_SUMMARY
          echo "- 标签: ${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- 版本: ${{ needs.version.outputs.v }}" >> $GITHUB_STEP_SUMMARY
          echo "- 查看: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建产物**" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Linux AppImage: ✅" >> $GITHUB_STEP_SUMMARY