name: 构建并推送 Pre Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-preview"]

jobs:
  # ==================== 版本生成 ====================
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

  # ==================== Windows 构建 ====================
  windows-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Sub-Module
        run: |
          git submodule update --init --recursive --remote
      - name: Build Windows executable
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:SelfContained=false `
            /p:Version=${{ needs.version.outputs.v }} `
            -o "./../../Release-publish/"
      - name: Rename Windows executable
        run: |
          cd ./Release-publish
          Rename-Item "BedrockBoot.exe" "BedrockBoot-${{ needs.version.outputs.v }}-win-x64.exe"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ./Release-publish/BedrockBoot-*-win-x64.exe

  # ==================== Linux 构建 (PupNet 驱动) ====================
  linux-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Sub-Module
        run: |
          git submodule update --init --recursive --remote

      - name: Install PupNet
        run: dotnet tool install --global KuiperZone.PupNet

      - name: Build AppImage with PupNet
        run: |
          # 1. 环境准备
          sudo apt-get update && sudo apt-get install -y libfuse2 imagemagick
          
          # 2. 使用 PupNet 的指令化快速打包 (参数化模式)
          # 注意：PupNet 的参数和 punet 略有不同
          # 我们直接利用 PupNet 的简洁模式快速生成
          pupnet --init \
            -v "${{ needs.version.outputs.v }}" \
            -app "BedrockBoot" \
            -id "top.roundstudio.bedrockboot" \
            -src "./src/BedrockBoot/BedrockBoot.csproj" \
            -i "./assets/BedrockBoot.Icon.512x.png" \
            -k "Game;Utility;" \
            -d "A powerful bootstrapping application for Minecraft Bedrock Edition."

          # 3. 运行打包
          # NO_APPSTREAM 依然作为底层保险
          export NO_APPSTREAM=1
          pupnet --build -r linux-x64 -k AppImage

      - name: Rename and Move Artifact
        run: |
          mkdir -p ./deploy
          # PupNet 默认输出在输出目录的子文件夹里，我们把它找出来
          find ./publish -name "*.AppImage" -exec mv {} ./deploy/BedrockBoot-${{ needs.version.outputs.v }}-linux-x86_64.AppImage \;

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ./deploy/*.AppImage

  # ==================== 发布 Release ====================
  create-release:
    runs-on: ubuntu-latest
    needs: [version, windows-build, linux-build]
    if: always() && needs.version.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files
          merge-multiple: true

      - name: Generate Checksums
        id: checksums
        run: |
          cd ./release-files
          sha256sum BedrockBoot-* > checksums.txt
          echo "CONTENT<<EOF" >> $GITHUB_OUTPUT
          cat checksums.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          release_name: "BedrockBoot ${{ needs.version.outputs.v }} - Pre-release"
          prerelease: true
          body: |
            ## 🚀 BedrockBoot 构建成功
            
            - **版本**: `${{ needs.version.outputs.v }}`
            - **引擎**: `KuiperZone.PupNet`
            
            ### 🔐 SHA256 校验和
            ```text
            ${{ steps.checksums.outputs.CONTENT }}
            ```
          files: |
            ./release-files/BedrockBoot-*-win-x64.exe
            ./release-files/BedrockBoot-*-linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}