name: 验证代码

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  license:
    runs-on: ubuntu-latest
    if: github.actor != 'roundstudio'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ROUNDSTUDIOBOT_TOKEN }}

      - name: Run license header script
        shell: pwsh
        run: |
          ./tools/Update-LicenseHeader.ps1
          exit 0

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "RoundStudio Bot"
          git config user.email "roundstudio@roundstudio.top"
          git add -A
          if git diff --cached --quiet; then
            echo "No license header changes."
          else
            git commit -m "chore: normalize license headers [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  version:
    runs-on: ubuntu-latest
    needs: license
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

  win-build:
    runs-on: windows-latest
    needs: version
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      API_GITHUB_CLIENT_ID: ${{ secrets.API_GITHUB_CLIENT_ID }}
      API_GITHUB_SECRET: ${{ secrets.API_GITHUB_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o "./../../win-publish/" /p:Version=${{ needs.version.outputs.v }} /p:BuildType=Preview

      - name: Rename Windows Output
        shell: pwsh
        run: |
          Get-ChildItem "./win-publish/*.exe" | Rename-Item -NewName "BedrockBoot-x86_64-win.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./win-publish/*.exe
          retention-days: 1

  linux-build:
    runs-on: ubuntu-latest
    needs: version
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      API_GITHUB_CLIENT_ID: ${{ secrets.API_GITHUB_CLIENT_ID }}
      API_GITHUB_SECRET: ${{ secrets.API_GITHUB_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Linux
        run: |
          ./build-appimage.sh ./src/BedrockBoot/BedrockBoot.csproj "BedrockBoot" ./assets/BedrockBoot.Icon.512x.png -version ${{ needs.version.outputs.v }} /p:BuildType=Preview

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ./artifacts
          retention-days: 1

  # 推送 CI 提交版版本号到 version 分支（info/commit）
  push-commit-info:
    runs-on: ubuntu-latest
    # version 必须显式列入 needs：needs context 只含直接依赖的 outputs，
    # 跨级引用 needs.version.outputs.v 会得到空串（曾因此写入空文件）
    needs: [version, win-build, linux-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push commit version to version branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin version | grep -q 'refs/heads/version'; then
            git fetch origin version --depth=1 2>/dev/null || true
            git checkout -B version FETCH_HEAD
          else
            # version 分支不存在：以孤儿分支初始化
            git checkout --orphan version
            git rm -rf . 2>/dev/null || true
          fi

          # CI 提交版版本号
          V="${{ needs.version.outputs.v }}"
          if [ -z "$V" ]; then
            echo "版本号输出为空，拒绝写入空文件" >&2
            exit 1
          fi
          mkdir -p info
          printf '%s' "$V" > info/commit
          git add info/commit

          git commit -m "chore: 更新 CI 提交版信息到 $V [skip ci]" || echo "无变更提交"
          git push origin version