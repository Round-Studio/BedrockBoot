name: 自动构建并推送 Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-main"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Generate version
        id: version
        run: |
          echo "value=2.1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "tag=v2.1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      
      - name: Show version info
        run: |
          echo "Build version: ${{ steps.version.outputs.value }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Build time: ${{ steps.time.outputs.value }}"

  win:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
      
      - name: Build
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false -o "./../../Release-publish/" /p:Version=${{ needs.version.outputs.v }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BedrockBoot.Publish
          path: |
            ./Release-publish/*

  release:
    runs-on: ubuntu-latest
    needs: [version, win]
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BedrockBoot.Publish
          path: ./release-artifacts
      
      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.TOKEN }}
          title: "v${{ needs.version.outputs.tag }}"
          automatic_release_tag: ${{ needs.version.outputs.tag }}
          prerelease: false
          files: |
            ./release-artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}