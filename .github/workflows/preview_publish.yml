name: 构建并推送 Pre Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-preview"]

permissions:
  contents: write

jobs:
  # 1. 生成版本号
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

  # 2. Windows 构建任务
  win-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Windows
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false -o "./../../win-publish/" /p:Version=${{ needs.version.outputs.v }}
      
      - name: Rename Windows Output
        shell: pwsh
        run: |
          Get-ChildItem "./win-publish/*.exe" | Rename-Item -NewName "BedrockBoot-x86_64-win.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./win-publish/*.exe
          retention-days: 1

  # 3. Linux 构建任务
  linux-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Linux
        run: |
          ./build-appimage.sh ./src/BedrockBoot/BedrockBoot.csproj "BedrockBoot" -version ${{ needs.version.outputs.v }}
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ./artifacts
          retention-days: 1

  # 4. 发布 Release
  release:
    runs-on: ubuntu-latest
    needs: [version, win-build, linux-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取全部历史以对比标签

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Smart Changelog (via GitHub API)
        id: commits
        shell: bash
        run: |
          # 1. 使用 GitHub CLI 获取上一个 Pre-Release 的 Tag 和 SHA
          # --json tagName,targetCommitish 会返回标签名和对应的提交哈希
          # jq 过滤出第一个 prerelease 为 true 的项
          PREV_RELEASE_INFO=$(gh release list --limit 100 --json tagName,isPrerelease,targetCommitish | jq -r '.[] | select(.isPrerelease == true) | "\(.tagName) \(.targetCommitish)"' | head -n 1)
          
          PREV_TAG=$(echo $PREV_RELEASE_INFO | cut -d' ' -f1)
          PREV_SHA=$(echo $PREV_RELEASE_INFO | cut -d' ' -f2)

          echo "changelog<<EOF" >> $GITHUB_OUTPUT

          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "null" ]; then
            echo "首次 Pre-Release 构建，显示最近 10 条变更：" >> $GITHUB_OUTPUT
            git log -10 --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          else
            echo "自上一个测试版 [$PREV_TAG] ($PREV_SHA) 及其之后的变更：" >> $GITHUB_OUTPUT
            # 获取从 PREV_SHA 到当前 HEAD 的变更
            # 如果 PREV_SHA 就是当前 SHA，则说明没有新提交
            if [ "$PREV_SHA" = "${{ github.sha }}" ]; then
              echo "- 当前提交已发布，无新变更" >> $GITHUB_OUTPUT
            else
              CHANGES=$(git log $PREV_SHA..${{ github.sha }} --pretty=format:"- %s (%h)")
              if [ -z "$CHANGES" ]; then
                echo "- 无功能变更（可能为非代码修改）" >> $GITHUB_OUTPUT
              else
                echo "$CHANGES" >> $GITHUB_OUTPUT
              fi
            fi
          fi

          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "BedrockBoot Build ${{ needs.version.outputs.tag }}"
          body: |
            ## BedrockBoot ${{ needs.version.outputs.v }} 测试版推送
            
            **构建详情**
            - 构建时间: ${{ needs.version.outputs.time }}
            - 提交 Hash: ${{ github.sha }}
            
            **本次更新内容**
            ${{ steps.commits.outputs.changelog }}
          draft: false
          prerelease: true
          files: |
            ./dist/*.exe
            ./dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}