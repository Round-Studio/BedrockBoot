name: 自动构建并推送 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
      build: ${{ steps.version.outputs.build }}
      prefix: ${{ steps.version.outputs.prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Generate version
        id: version
        shell: bash
        run: |
          # 从 version 分支读取构建号与前缀
          PREFIX="2.1.10"
          BUILD="1"
          if git ls-remote --heads origin version | grep -q 'refs/heads/version'; then
            git fetch origin version --depth=1 2>/dev/null || true
            [ -n "$(git show FETCH_HEAD:version 2>/dev/null)" ] && PREFIX=$(git show FETCH_HEAD:version | tr -d '[:space:]')
            [ -n "$(git show FETCH_HEAD:build 2>/dev/null)" ] && BUILD=$(git show FETCH_HEAD:build | tr -d '[:space:]')
          fi

          VERSION="${PREFIX}.${BUILD}"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      
      - name: Show version info
        run: |
          echo "Build version: ${{ steps.version.outputs.value }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Build time: ${{ steps.time.outputs.value }}"

  # 2. Windows 构建任务
  win-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Windows
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false -o "./../../win-publish/" /p:Version=${{ needs.version.outputs.v }}
      
      - name: Rename Windows Output
        shell: pwsh
        run: |
          Get-ChildItem "./win-publish/*.exe" | Rename-Item -NewName "BedrockBoot-x86_64-win.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./win-publish/*.exe
          retention-days: 1

  # 3. Linux 构建任务
  linux-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Linux
        run: |
          ./build-appimage.sh ./src/BedrockBoot/BedrockBoot.csproj "BedrockBoot" ./assets/BedrockBoot.Icon.512x.png -version ${{ needs.version.outputs.v }}
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ./artifacts
          retention-days: 1

  # 4. 发布 Release
  release:
    runs-on: ubuntu-latest
    needs: [version, win-build, linux-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取全部历史以对比标签

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Smart Changelog (only from releases)
        id: commits
        shell: bash
        run: |
          # 1. 使用 GitHub CLI 获取上一个 正式版 (prerelease: false) 的发布时间
          # 过滤掉当前正在生成的 tag，确保获取的是“上一个”
          PREV_RELEASE_DATA=$(gh release list --limit 20 --json tagName,isPrerelease,publishedAt | \
            jq -r --arg CUR_TAG "${{ needs.version.outputs.tag }}" \
            '.[] | select(.isPrerelease == false and .tagName != $CUR_TAG) | .tagName + " " + .publishedAt' | \
            head -n 1)

          PREV_TAG=$(echo $PREV_RELEASE_DATA | cut -d' ' -f1)
          PREV_TIME=$(echo $PREV_RELEASE_DATA | cut -d' ' -f2)

          echo "changelog<<EOF" >> $GITHUB_OUTPUT

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            echo "首次正式版发布，显示最近 15 条变更：" >> $GITHUB_OUTPUT
            git log -15 --oneline --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          else
            echo "自上一正式版 [$PREV_TAG] ($PREV_TIME) 以来的更新内容：" >> $GITHUB_OUTPUT
            
            # 2. 获取自 PREV_TIME 之后的所有非合并提交
            # 使用 --no-merges 让正式版的 Changelog 看起来更简洁
            # 过滤掉 CI 相关的琐碎提交，只保留功能和修复
            CHANGES=$(git log --since="$PREV_TIME" --no-merges --pretty=format:"- %s (%h)" | \
              grep -vE "^- ci:|^ - style:|^ - chore:" || echo "")
            
            if [ -z "$CHANGES" ]; then
              echo "- 包含性能优化与稳定性提升" >> $GITHUB_OUTPUT
            else
              echo "$CHANGES" >> $GITHUB_OUTPUT
            fi
          fi

          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "BedrockBoot Build ${{ needs.version.outputs.tag }}"
          body: |
            ## BedrockBoot ${{ needs.version.outputs.v }} 正式版推送
            
            **构建详情**
            - 构建时间: ${{ needs.version.outputs.time }}
            - 提交 Hash: ${{ github.sha }}
            
            **本次更新内容**
            ${{ steps.commits.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            ./dist/*.exe
            ./dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 递增构建号并推送 version 分支
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin version | grep -q 'refs/heads/version'; then
            git fetch origin version --depth=1 2>/dev/null || true
            git checkout -B version FETCH_HEAD
          else
            # version 分支不存在：以孤儿分支初始化并创建版本文件
            git checkout --orphan version
            git rm -rf . 2>/dev/null || true
          fi

          BUILD=${{ needs.version.outputs.build }}
          BUILD_NEW=$((BUILD + 1))
          echo "$BUILD_NEW" > build

          # 前缀文件：仅在分支不存在时由机器人初始化，之后永远不修改
          if [ -f version ]; then
            git add build
          else
            echo "${{ needs.version.outputs.prefix }}" > version
            git add build version
          fi

          git commit -m "chore: 更新构建号到 $BUILD_NEW [skip ci]" || echo "无变更提交"
          git push origin version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
