name: 手动构建并推送 PreRelease

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 生成版本号
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

  # 2. Windows 构建任务
  win-build:
    runs-on: windows-latest
    needs: version
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      API_GITHUB_CLIENT_ID: ${{ secrets.API_GITHUB_CLIENT_ID }}
      API_GITHUB_SECRET: ${{ secrets.API_GITHUB_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Windows
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o "./../../win-publish/" /p:Version=${{ needs.version.outputs.v }} /p:BuildType=Preview
      
      - name: Rename Windows Output
        shell: pwsh
        run: |
          Get-ChildItem "./win-publish/*.exe" | Rename-Item -NewName "BedrockBoot-x86_64-win.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./win-publish/*.exe
          retention-days: 1

  # 3. Linux 构建任务
  linux-build:
    runs-on: ubuntu-latest
    needs: version
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      API_GITHUB_CLIENT_ID: ${{ secrets.API_GITHUB_CLIENT_ID }}
      API_GITHUB_SECRET: ${{ secrets.API_GITHUB_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Linux
        run: |
          ./build-appimage.sh ./src/BedrockBoot/BedrockBoot.csproj "BedrockBoot" ./assets/BedrockBoot.Icon.512x.png -version ${{ needs.version.outputs.v }} /p:BuildType=Preview
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ./artifacts
          retention-days: 1

  # 4. 发布 Release
  release:
    runs-on: ubuntu-latest
    needs: [version, win-build, linux-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取全部历史以对比标签

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Smart Changelog
        id: commits
        shell: bash
        run: |
          # w()：把内容同时写入 GITHUB_OUTPUT 和落盘的 body 文件，
          # 供后续步骤直接拿文件组装 changelog/<版本号>.md（避免把提交内容二次注入 bash）
          BODY_FILE=./version-changelog-body.md
          : > "$BODY_FILE"
          w() { tee -a "$BODY_FILE" >> $GITHUB_OUTPUT; }

          # 1. 获取上一个 Pre-release 的发布时间
          # 取最近一个非当前的 tag 的发布时间 (publishedAt)
          PREV_RELEASE_DATA=$(gh release list --limit 20 --json tagName,isPrerelease,publishedAt | \
            jq -r --arg CUR_TAG "${{ needs.version.outputs.tag }}" \
            '.[] | select(.isPrerelease == true and .tagName != $CUR_TAG) | .tagName + " " + .publishedAt' | \
            head -n 1)

          PREV_TAG=$(echo $PREV_RELEASE_DATA | cut -d' ' -f1)
          PREV_TIME=$(echo $PREV_RELEASE_DATA | cut -d' ' -f2)

          echo "changelog<<EOF" >> $GITHUB_OUTPUT

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            echo "首次构建，显示最近 10 条提交：" | w
            git log -10 --pretty=format:"- %s (%h)" | grep -vE "^- (ci|style|chore):" | w || true
          else
            echo "自上一个测试版 [$PREV_TAG] ($PREV_TIME) 以来进入分支的变更：" | w

            # 2. 获取自 PREV_TIME 之后的所有提交
            # --since 使用发布时间作为过滤基准
            # --no-merges 过滤掉合并提交
            # 使用 --reverse 让日志按时间顺序排列（可选）
            git log --since="$PREV_TIME" --no-merges --pretty=format:"- %s (%h)" | grep -vE "^- (ci|style|chore):" | w || true
          fi

          echo "" | w
          echo "EOF" >> $GITHUB_OUTPUT

          # 组装 version 分支用的完整修改日志文件
          {
            echo "# BedrockBoot ${{ needs.version.outputs.tag }} 预览版"
            echo ""
            echo "- 构建时间: ${{ needs.version.outputs.time }}"
            echo "- 提交 Hash: ${{ github.sha }}"
            echo ""
            cat "$BODY_FILE"
          } > ./version-changelog.md
          rm -f "$BODY_FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "${{ needs.version.outputs.tag }}"
          body: |
            ## BedrockBoot ${{ needs.version.outputs.v }} 测试版推送
            
            **构建详情**
            - 构建时间: ${{ needs.version.outputs.time }}
            - 提交 Hash: ${{ github.sha }}
            
            **本次更新内容**
            ${{ steps.commits.outputs.changelog }}
          draft: false
          prerelease: true
          files: |
            ./dist/*.exe
            ./dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送预览版信息到 version 分支
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin version | grep -q 'refs/heads/version'; then
            git fetch origin version --depth=1 2>/dev/null || true
            git checkout -B version FETCH_HEAD
          else
            # version 分支不存在：以孤儿分支初始化
            git checkout --orphan version
            git rm -rf . 2>/dev/null || true
          fi

          # 本次预览版信息：info/preview 存版本号；changelog/<版本号>.md 存修改日志
          V="${{ needs.version.outputs.v }}"
          if [ -z "$V" ]; then
            echo "版本号输出为空，拒绝写入空文件" >&2
            exit 1
          fi
          mkdir -p info changelog
          printf '%s' "$V" > info/preview
          cp ./version-changelog.md "changelog/$V.md"
          git add info changelog

          git commit -m "chore: 更新预览版信息到 $V [skip ci]" || echo "无变更提交"
          git push origin version
