name: 构建并推送 Pre Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 生成版本号
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

  # 2. Windows 构建任务
  win-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Windows
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false -o "./../../win-publish/" /p:Version=${{ needs.version.outputs.v }}
      
      - name: Rename Windows Output
        shell: pwsh
        run: |
          Get-ChildItem "./win-publish/*.exe" | Rename-Item -NewName "BedrockBoot-x86_64-win.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: ./win-publish/*.exe
          retention-days: 1

  # 3. Linux 构建任务
  linux-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Build Linux
        run: |
          ./build-appimage.sh ./src/BedrockBoot/BedrockBoot.csproj "BedrockBoot" ./assets/BedrockBoot.Icon.512x.png -version ${{ needs.version.outputs.v }}
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ./artifacts
          retention-days: 1

  # 4. 发布 Release
  release:
    runs-on: ubuntu-latest
    needs: [version, win-build, linux-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取全部历史以对比标签

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Smart Changelog
        id: commits
        shell: bash
        run: |
          # 1. 获取上一个 Pre-release 的发布时间
          # 取最近一个非当前的 tag 的发布时间 (publishedAt)
          PREV_RELEASE_DATA=$(gh release list --limit 20 --json tagName,isPrerelease,publishedAt | \
            jq -r --arg CUR_TAG "${{ needs.version.outputs.tag }}" \
            '.[] | select(.isPrerelease == true and .tagName != $CUR_TAG) | .tagName + " " + .publishedAt' | \
            head -n 1)

          PREV_TAG=$(echo $PREV_RELEASE_DATA | cut -d' ' -f1)
          PREV_TIME=$(echo $PREV_RELEASE_DATA | cut -d' ' -f2)

          echo "changelog<<EOF" >> $GITHUB_OUTPUT

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            echo "首次构建，显示最近 10 条提交：" >> $GITHUB_OUTPUT
            git log -10 --oneline --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          else
            echo "自上一个测试版 [$PREV_TAG] ($PREV_TIME) 以来进入分支的变更：" >> $GITHUB_OUTPUT
            
            # 2. 获取自 PREV_TIME 之后的所有提交
            # --since 使用发布时间作为过滤基准
            # --no-merges 过滤掉合并提交
            # 使用 --reverse 让日志按时间顺序排列（可选）
            git log --since="$PREV_TIME" --no-merges --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          fi

          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "BedrockBoot Build ${{ needs.version.outputs.tag }}"
          body: |
            ## BedrockBoot ${{ needs.version.outputs.v }} 测试版推送
            
            **构建详情**
            - 构建时间: ${{ needs.version.outputs.time }}
            - 提交 Hash: ${{ github.sha }}
            
            **本次更新内容**
            ${{ steps.commits.outputs.changelog }}
          draft: false
          prerelease: true
          files: |
            ./dist/*.exe
            ./dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
