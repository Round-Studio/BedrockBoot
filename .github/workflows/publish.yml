name: Publish and Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-develop"]

jobs:
  time:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.date.outputs.time }}
      y: ${{ steps.date.outputs.y }}
      md: ${{ steps.date.outputs.md }}
      hm: ${{ steps.date.outputs.hm }}
      tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Time
        id: date
        run: |
          echo "::set-output name=time::$(date +'%Y.%m.%d.%H.%M')"
          echo "::set-output name=y::$(date +'%Y')"
          echo "::set-output name=md::$(date +'%m%d')"
          echo "::set-output name=hm::$(date +'%H%M')"
          echo "::set-output name=tag::v$(date +'%Y.%m.%d.%H%M')"
      - name: EchoTime
        run: |
          echo "The current time is: ${{ steps.date.outputs.time }}"
          echo "Tag: ${{ steps.date.outputs.tag }}"

  win:
    runs-on: windows-latest
    needs: time
    outputs:
      artifact-path: ${{ steps.artifact-path.outputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
      
      - name: Build
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Debug -r win-x86 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=true -o "./../../debug-publish/" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Get Artifact Path
        id: artifact-path
        run: |
          echo "path=debug-publish" >> $GITHUB_OUTPUT
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BedrockBoot.Publish.24h.Debug
          path: |
            ./debug-publish/*

  release:
    runs-on: ubuntu-latest
    needs: [time, win]
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BedrockBoot.Publish.24h.Debug
          path: ./release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.time.outputs.tag }}
          release_name: "Release ${{ needs.time.outputs.tag }}"
          body: |
            Automated release from ${{ github.sha }}
            
            Build time: ${{ needs.time.outputs.time }}
            
            Changes:
            - Auto-generated release
            - Built from 2.0-develop branch
          draft: false
          prerelease: true
          files: |
            ./release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}