name: 构建并推送 Pre Release

on:
  workflow_dispatch:
  push:
    branches: ["2.0-preview"]

jobs:
  # ==================== 版本生成 ====================
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      time: ${{ steps.time.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M')
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Get current time
        id: time
        run: |
          echo "value=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

  # ==================== Windows 构建 ====================
  windows-build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: |
          cd ./src/BedrockBoot
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:SelfContained=false /p:Version=${{ needs.version.outputs.v }} -o "./../../Release-publish/"
      - name: Rename
        run: |
          cd ./Release-publish
          if (Test-Path "BedrockBoot.exe") {
            Rename-Item "BedrockBoot.exe" "BedrockBoot-win-x64.exe"
          }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ./Release-publish/BedrockBoot-win-x64.exe

  # ==================== Linux 构建 (PupNet) ====================
  linux-build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install PupNet
        run: dotnet tool install --global KuiperZone.PupNet

      - name: Prepare PupNet Config
        run: |
          cat > pupnet.conf << EOF
          AppId: top.roundstudio.bedrockboot
          AppName: BedrockBoot
          Company: RoundStudio
          Description: >-
            BedrockBoot is a powerful, open-source bootstrapping application 
            specifically designed for Minecraft Bedrock Edition. It provides 
            a seamless way to manage and launch game instances on Linux systems 
            using the latest .NET technologies.
          IconPath: assets/BedrockBoot.Icon.512x.png
          ProjectPath: src/BedrockBoot/BedrockBoot.csproj
          License: GPL-3.0-only
          Categories: Game;Utility;
          DotnetPublish:
            SelfContained: true
            ReadyToRun: true
          AppStream:
            Enabled: true
            DeveloperName: RoundStudio
            UrlHome: https://github.com/RoundStudio/BedrockBoot
          EOF

      - name: Build AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2
          
          rm -rf AppDir
          rm -rf publish
          
          export NO_APPSTREAM=1
          
          pupnet --build -r linux-x64 -k AppImage --v "${{ needs.version.outputs.v }}"

      - name: Move and Rename Artifact
        run: |
          mkdir -p ./deploy
          # 从 PupNet 默认输出路径提取文件
          find ./publish -name "*.AppImage" -exec mv {} ./deploy/BedrockBoot-linux-x86_64.AppImage \;

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ./deploy/BedrockBoot-linux-x86_64.AppImage

  # ==================== 发布 Release ====================
  create-release:
    runs-on: ubuntu-latest
    needs: [version, windows-build, linux-build]
    if: always() && needs.version.result == 'success'
    steps:
      - name: Download all
        uses: actions/download-artifact@v4
        with:
          path: ./release-files
          merge-multiple: true

      - name: Generate Checksums
        id: checksums
        run: |
          cd ./release-files
          sha256sum BedrockBoot-* > checksums.txt
          echo "CONTENT<<EOF" >> $GITHUB_OUTPUT
          cat checksums.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          release_name: "BedrockBoot ${{ needs.version.outputs.v }} - Pre-release"
          prerelease: true
          body: |
            ## 🚀 BedrockBoot 构建成功
            
            - **版本**: `${{ needs.version.outputs.v }}`
            - **时间**: `${{ needs.version.outputs.time }}`
            
            ### 🔐 SHA256 校验和
            ```text
            ${{ steps.checksums.outputs.CONTENT }}
            ```
          files: |
            ./release-files/*.exe
            ./release-files/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}